<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masjid Al-Noor - Infaq</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .bg-masjid { background-color: #042f24; } /* Dark Emerald */
        .text-gold { color: #facc15; }
        .bg-gold { background-color: #facc15; }
    </style>
</head>
<body class="bg-masjid text-white font-sans min-h-screen">

    <!-- PAGE 1: LANDING -->
    <div id="page-landing" class="max-w-md mx-auto p-4 pb-20">
        <header class="flex justify-between items-center py-4 mb-6">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gold rounded-md flex items-center justify-center text-masjid font-bold">M</div>
                <span class="font-bold tracking-widest text-sm text-gold">MASJID AL-NOOR</span>
            </div>
            <i class="fa-regular fa-circle-user text-2xl text-gold"></i>
        </header>

        <!-- Hero Card -->
        <div class="relative bg-gradient-to-br from-emerald-800 to-masjid rounded-3xl p-6 border border-emerald-700 mb-8 overflow-hidden">
            <div class="relative z-10">
                <span class="bg-gold text-masjid text-[10px] font-bold px-3 py-1 rounded-md">UTAMA</span>
                <h1 class="text-3xl font-bold mt-4 leading-tight">Tabung<br>Pembangunan</h1>
                <p class="text-gray-300 text-sm mt-2">Sumbangan ikhlas untuk fasa naik taraf fasiliti dan prasarana masjid.</p>
                <button onclick="showForm('pembangunan')" class="mt-6 w-full bg-gold text-masjid font-bold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-yellow-900/20">
                    Infaq Sekarang <i class="fa-solid fa-money-bill-wave"></i>
                </button>
            </div>
        </div>

        <!-- Prayer Times -->
        <div class="bg-black/20 rounded-2xl p-4 flex justify-between items-center mb-8 border border-white/5">
            <i class="fa-regular fa-clock text-gold text-xl"></i>
            <div class="text-center"><p class="text-[10px] text-gray-400 uppercase">Subuh</p><p class="font-bold text-sm">05:48</p></div>
            <div class="text-center"><p class="text-[10px] text-gray-400 uppercase">Zohor</p><p class="font-bold text-sm">13:15</p></div>
            <div class="text-center"><p class="text-[10px] text-gray-400 uppercase">Asar</p><p class="font-bold text-sm">16:32</p></div>
            <div class="text-center text-gold"><p class="text-[10px] uppercase">Maghrib</p><p class="font-bold text-sm">19:12</p></div>
        </div>

        <!-- Options -->
        <h3 class="text-xl font-bold mb-4">Pilihan Infaq</h3>
        <div class="space-y-4">
            <div onclick="showForm('kebajikan')" class="bg-white/5 p-4 rounded-2xl flex items-center gap-4 cursor-pointer border border-white/5 hover:bg-white/10">
                <div class="w-12 h-12 bg-emerald-900 rounded-xl flex items-center justify-center text-gold"><i class="fa-solid fa-heart"></i></div>
                <div class="flex-1"><h4 class="font-bold">Tabung Kebajikan</h4><p class="text-[10px] text-gray-400">Bantuan asnaf & fakir miskin</p></div>
                <i class="fa-solid fa-chevron-right text-gold"></i>
            </div>
            <!-- Ulang untuk tabung lain -->
        </div>
    </div>

    <!-- PAGE 2: FORM (HIDDEN BY DEFAULT) -->
    <div id="page-form" class="hidden max-w-md mx-auto p-4 min-h-screen flex flex-col">
        <header class="flex items-center py-4 mb-8">
            <i onclick="showLanding()" class="fa-solid fa-arrow-left text-gold text-xl cursor-pointer"></i>
            <span class="flex-1 text-center font-bold text-gold tracking-widest text-sm">BORANG INFAQ</span>
        </header>

        <div class="bg-black/20 rounded-3xl p-6 border border-white/5">
            <h2 class="text-2xl font-bold text-center mb-2">Borang Infaq</h2>
            <p id="selected-tabung" class="text-center text-gray-400 text-sm mb-8 italic capitalize"></p>

            <label class="block text-sm font-bold mb-3">Pilih Jumlah (RM)</label>
            <div class="grid grid-cols-3 gap-3 mb-4">
                <button onclick="setAmount(10)" class="btn-amt border border-emerald-800 py-3 rounded-xl hover:bg-emerald-800">10</button>
                <button onclick="setAmount(50)" class="btn-amt border border-emerald-800 py-3 rounded-xl bg-emerald-800/50">50</button>
                <button onclick="setAmount(100)" class="btn-amt border border-emerald-800 py-3 rounded-xl hover:bg-emerald-800">100</button>
            </div>

            <input type="number" id="amt-custom" placeholder="RM Jumlah Lain" class="w-full bg-black/20 border border-emerald-800 p-4 rounded-xl mb-4 outline-none focus:border-gold">
            <input type="text" id="nama" placeholder="Nama Penuh" class="w-full bg-black/20 border border-emerald-800 p-4 rounded-xl mb-4 outline-none">
            
            <div class="grid grid-cols-2 gap-3 mb-8">
                <input type="text" id="phone" placeholder="No. Telefon" class="w-full bg-black/20 border border-emerald-800 p-4 rounded-xl outline-none">
                <input type="email" id="email" placeholder="Emel" class="w-full bg-black/20 border border-emerald-800 p-4 rounded-xl outline-none">
            </div>

            <button onclick="payNow()" id="pay-btn" class="w-full bg-gold text-masjid font-bold py-5 rounded-2xl shadow-xl flex items-center justify-center gap-2">
                <i class="fa-solid fa-hand-holding-heart"></i> Infaq Sekarang
            </button>
        </div>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwvz9VQzLDFtKT3LFrhJ4HO0m0RgfQ4mjMOQw7h8gpEtivdiyA5R9Z3lLjIK7lA4brh/exec';
        let currentTabung = '';
        let selectedAmount = 50;

        function showForm(tabung) {
            currentTabung = tabung;
            document.getElementById('selected-tabung').innerText = "Tabung " + tabung;
            document.getElementById('page-landing').classList.add('hidden');
            document.getElementById('page-form').classList.remove('hidden');
        }

        function showLanding() {
            document.getElementById('page-landing').classList.remove('hidden');
            document.getElementById('page-form').classList.add('hidden');
        }

        function setAmount(amt) {
            selectedAmount = amt;
            document.getElementById('amt-custom').value = '';
            // Reset & highlight buttons (logik CSS ringkas)
        }

        async function payNow() {
            const amount = document.getElementById('amt-custom').value || selectedAmount;
            const nama = document.getElementById('nama').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;

            document.getElementById('pay-btn').innerHTML = "Memproses...";
            
            const response = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({
                    amount, tabung: currentTabung, nama, phone, email,
                    returnUrl: window.location.href + "?success=true&amt=" + amount
                })
            });

            const result = await response.json();
            if(result.status === 'success') window.location.href = result.payment_url;
        }

        // Cek jika balik dari ToyyibPay (Success Page)
        const params = new URLSearchParams(window.location.search);
        if(params.has('success')) {
            document.getElementById('page-landing').innerHTML = `
                <div class="text-center py-20">
                    <div class="w-20 h-20 bg-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">✓</div>
                    <h2 class="text-3xl font-bold mb-2">Alhamdulillah</h2>
                    <p class="text-gray-400 mb-8">Infaq anda berjaya direkodkan.</p>
                    <div class="bg-black/20 p-6 rounded-3xl border border-white/5 mb-8">
                        <p class="text-gold text-2xl font-bold">RM ${params.get('amt')}</p>
                    </div>
                    <button onclick="window.location.href='index.html'" class="w-full border border-gold text-gold font-bold py-4 rounded-2xl">Kembali Ke Utama</button>
                </div>
            `;
        }
    </script>
</body>
</html>
